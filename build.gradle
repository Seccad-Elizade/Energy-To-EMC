buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // Required for Gradle 8.4 support
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

// ✅ SETTINGS: Version 1.0.1
version = "1.0.1"
group = "com.seccad_elizade.energytoemc"
def mod_id = "energytoemc"
def mc_version = "1.16.5"
def mod_authors = "Seccad Elizade"

base {
    // ✅ This creates the file name: energytoemc-1.16.5-1.0.1.jar
    archivesName = "${mod_id}-${mc_version}"
}

// 1.16.5 MUST use Java 8
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { name = "Progwml6 maven"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.16.5-36.2.34"

    // JEI for 1.16.5
    implementation fg.deobf("mezz.jei:jei-1.16.5:7.7.1.152")

    // ProjectE local JAR (Ensure ProjectE-1.16.5-PE1.0.2.jar is in the /libs folder)
    implementation fg.deobf(project.dependencies.create(group: "local", name: "ProjectE-1.16.5-PE1.0.2", version: "1.0.2"))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: mc_version,
            minecraft_version_range: "[1.16.5, 1.17)",
            forge_version: "36.2.34",
            forge_version_range: "[36,)",
            loader_version_range: "[36,)",
            mod_id: mod_id,
            mod_name: "Energy To Emc",
            mod_license: "MIT",
            mod_version: project.version, // Pulls "1.0.1"
            mod_authors: mod_authors,
            mod_description: "A high-performance bridge between Forge Energy and ProjectE."
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}